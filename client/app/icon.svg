<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title">
  <title id="title">DECK — Plan. Track. Achieve.</title>
  <!-- Background for favicon contexts that need a white field; outer platforms will mask it -->
  <rect width="100" height="100" rx="22" fill="#0B0F14"/>
  <!-- Geometric D -->
  <!-- Outer D shape -->
  <path fill="#FFFFFF" d="M 22 16 H 52.5 C 70.2 16 84.5 28.2 84.5 50 C 84.5 71.8 70.2 84 52.5 84 H 34.2 V 56.2 H 52.5 C 60.8 56.2 66.5 52.1 66.5 49.9 C 66.5 47.7 60.8 43.6 52.5 43.6 H 40.2 V 16 H 22 Z"/>
  <!-- Add vertical stem left edge correction - ensure solid -->
  <rect x="22" y="16" width="18" height="42" fill="#FFFFFF"/>
  <!-- Inner counter punch (creates D hole) - overlay same bg to cut out -->
  <!-- Actually we already left inner hole via path, but ensure clean -->
  <!-- Diagonal gap line -->
  <path d="M 22 68.5 L 35.2 54.2 L 37.8 54.2 L 24.6 68.8 Z" fill="#0B0F14"/>
  <!-- Wedge - Electric Violet -->
  <path fill="#7C5CFF" d="M 24.2 76.2 L 39.2 60.2 L 56.2 60.2 L 56.2 84 L 26.2 84 C 23.2 84 22 82.5 22 79.2 L 24.2 76.2 Z"/>
  <!-- Subtle inner highlight on wedge for depth -->
  <path fill="white" opacity="0.08" d="M 24.2 76.2 L 39.2 60.2 L 56.2 60.2 L 56.2 68 L 30 68 Z"/>
</svg>
